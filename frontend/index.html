<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltHaven — Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ─── Login Page ─── */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-root);
        }

        .login-card {
            width: 380px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 40px 36px 36px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-brand .logo-text {
            font-size: 1.4rem;
            letter-spacing: 3px;
        }
        .login-brand .logo-subtitle {
            display: block;
            margin-top: 6px;
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }
        .login-field label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }
        .login-field input {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-normal);
            padding: 11px 14px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }
        .login-field input:focus {
            border-color: var(--green);
        }
        .login-field input::placeholder {
            color: var(--text-muted);
        }

        .login-error {
            font-size: 0.8rem;
            color: var(--red);
            text-align: center;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: rgba(184, 56, 48, 0.1);
            border: 1px solid rgba(184, 56, 48, 0.25);
            border-radius: var(--radius);
            transition: opacity 0.2s;
        }
        .login-error.hidden {
            opacity: 0;
            pointer-events: none;
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }

        .login-btn {
            width: 100%;
            background: var(--green);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: var(--green-bright);
        }
        .login-btn:active {
            transform: scale(0.98);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <span class="logo-text">VOLTHAVEN</span>
                <span class="logo-subtitle">EV Infrastructure Planning — Delhi</span>
            </div>

            <form id="login-form" autocomplete="off">
                <div class="login-field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter username" autofocus>
                </div>
                <div class="login-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password">
                </div>

                <div class="login-error hidden" id="login-error">
                    Invalid username or password. Please try again.
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="login-footer">
                City Planner Dashboard &middot; Authorized Access Only
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var username = document.getElementById('login-username').value;
            var password = document.getElementById('login-password').value;
            var errorEl  = document.getElementById('login-error');

            if (username === 'admin' && password === 'admin123') {
                window.location.href = 'dashboard.html';
            } else {
                errorEl.classList.remove('hidden');
                document.getElementById('login-password').value = '';
                document.getElementById('login-password').focus();
            }
        });

        // Hide error on new input
        document.getElementById('login-username').addEventListener('input', function () {
            document.getElementById('login-error').classList.add('hidden');
        });
        document.getElementById('login-password').addEventListener('input', function () {
            document.getElementById('login-error').classList.add('hidden');
        });
    </script>
</body>
</html>
