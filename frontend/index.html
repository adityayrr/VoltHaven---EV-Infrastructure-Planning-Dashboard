<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltHaven — Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ─── Login Page ─── */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-root);
        }

        .login-card {
            width: 380px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 40px 36px 36px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-brand .logo-text {
            font-size: 1.4rem;
            letter-spacing: 3px;
        }
        .login-brand .logo-subtitle {
            display: block;
            margin-top: 6px;
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }
        .login-field label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }
        .login-field input {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-normal);
            padding: 11px 14px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s;
        }
        .login-field input:focus {
            border-color: var(--green);
        }
        .login-field input::placeholder {
            color: var(--text-muted);
        }

        .login-error {
            font-size: 0.8rem;
            color: var(--red);
            text-align: center;
            margin-bottom: 16px;
            padding: 8px 12px;
            background: rgba(184, 56, 48, 0.1);
            border: 1px solid rgba(184, 56, 48, 0.25);
            border-radius: var(--radius);
            transition: opacity 0.2s;
        }
        .login-error.hidden {
            opacity: 0;
            pointer-events: none;
            height: 0;
            margin: 0;
            padding: 0;
            border: none;
            overflow: hidden;
        }

        .login-btn {
            width: 100%;
            background: var(--green);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: var(--green-bright);
        }
        .login-btn:active {
            transform: scale(0.98);
        }

        /* ─── OAuth Divider & Buttons ─── */
        .login-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-muted);
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
        .login-divider span {
            padding: 0 12px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .oauth-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
            letter-spacing: 0.3px;
        }

        .oauth-icon {
            flex-shrink: 0;
        }

        .oauth-google {
            background: #ffffff;
            color: #1f1f1f;
            border: 1px solid #d1d5db;
        }
        .oauth-google:hover {
            background: #f3f4f6;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.15);
        }
        .oauth-google:active {
            transform: scale(0.98);
        }

        .oauth-github {
            background: #24292e;
            color: #ffffff;
            border: 1px solid #444c56;
        }
        .oauth-github:hover {
            background: #2f363d;
            border-color: #6e7681;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .oauth-github:active {
            transform: scale(0.98);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <span class="logo-text">VOLTHAVEN</span>
                <span class="logo-subtitle">EV Infrastructure Planning — Delhi</span>
            </div>

            <form id="login-form" autocomplete="off">
                <div class="login-field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" placeholder="Enter username" autofocus>
                </div>
                <div class="login-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password">
                </div>

                <div class="login-error hidden" id="login-error">
                    Invalid username or password. Please try again.
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="login-divider">
                <span>OR</span>
            </div>

            <div class="oauth-buttons">
                <button type="button" class="oauth-btn oauth-google" onclick="console.log('OAuth pending')">
                    <svg class="oauth-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continue with Google
                </button>
                <button type="button" class="oauth-btn oauth-github" onclick="console.log('OAuth pending')">
                    <svg class="oauth-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    Continue with GitHub
                </button>
            </div>

            <div class="login-footer">
                City Planner Dashboard &middot; Authorized Access Only
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var username = document.getElementById('login-username').value;
            var password = document.getElementById('login-password').value;
            var errorEl  = document.getElementById('login-error');

            if (username === 'admin' && password === 'admin123') {
                window.location.href = 'dashboard.html';
            } else {
                errorEl.classList.remove('hidden');
                document.getElementById('login-password').value = '';
                document.getElementById('login-password').focus();
            }
        });

        // Hide error on new input
        document.getElementById('login-username').addEventListener('input', function () {
            document.getElementById('login-error').classList.add('hidden');
        });
        document.getElementById('login-password').addEventListener('input', function () {
            document.getElementById('login-error').classList.add('hidden');
        });
    </script>
</body>
</html>
